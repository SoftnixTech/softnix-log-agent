# Windows example configuration.
agent:
  data_dir: 'C:\ProgramData\Softnix\LogAgent'
  log_level: info

inputs:
  files:
    - id: app-logs
      paths:
        - 'C:\Logs\*.log'
        - 'C:\App\Logs\**\*.log'
      exclude:
        - 'C:\Logs\debug-*.log'
  syslog:
    - id: udp514
      protocol: udp
      bind: 0.0.0.0
      port: 514
  # Native Windows Event Log collection (Windows-only).
  eventlog:
    - id: winevents
      channels:
        - Application
        - System
        - Security
        # - Microsoft-Windows-Sysmon/Operational
      # XPath filter; "*" = all events. Example below keeps
      # Critical/Error/Warning only:
      # query: "*[System[(Level=1 or Level=2 or Level=3)]]"
      query: "*"
      # On first run, collect only new events (set true to backfill existing).
      read_existing: false

pipeline:
  enrich:
    environment: production
    site: hq

buffer:
  max_size_mb: 512
  full_policy: drop_oldest

outputs:
  - id: central-syslog
    type: syslog
    protocol: tcp
    address: logserver.corp.local:514
    format: rfc5424

web:
  enabled: true
  bind: 127.0.0.1
  port: 8080
