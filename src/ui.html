<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Softnix Log Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%234f9cf0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f151c; --surface:#161e28; --surface-2:#1d2732; --sunken:#0b1016;
  --line:#2b3644; --line-strong:#33404f;
  --fg:#dde5ef; --dim:#9aabbf; --fg-disabled:#6b7d92;
  --ok:#4cc880; --warn:#e5b155; --err:#ef7676; --acc:#63a8f5;
  --ok-bg:rgba(76,200,128,.12); --warn-bg:rgba(229,177,85,.12);
  --err-bg:rgba(239,118,118,.12); --acc-bg:rgba(99,168,245,.12);
  --btn-ink:#0b1016;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --content:1440px; --chrome:86px; --r:6px; --r-sm:4px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#eef1f6; --sunken:#f7f9fb;
  --line:#d5dce5; --line-strong:#c2ccd8;
  --fg:#111a24; --dim:#5a6b80; --fg-disabled:#7a879a;
  --ok:#127a41; --warn:#8a5300; --err:#c0272d; --acc:#155fc0;
  --ok-bg:rgba(18,122,65,.10); --warn-bg:rgba(138,83,0,.10);
  --err-bg:rgba(192,39,45,.09); --acc-bg:rgba(21,95,192,.09);
  --btn-ink:#ffffff;
  --shadow:0 1px 2px rgba(16,24,32,.08);
  color-scheme:light;
}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}

/* header + nav: one sticky chrome unit */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
header .logo{height:32px;width:auto;flex:none;display:block}
header h1{font:600 15px/1.2 var(--sans)}
header .v{color:var(--dim);font-size:12px}
.hmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-left:auto}
.live{font:12px var(--sans);color:var(--dim)}
.live.paused{color:var(--warn)}
nav{display:flex;gap:2px;padding:0 20px;background:var(--surface);
    border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:48px;z-index:19}
#nav button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;
  padding:9px 14px;margin:0;color:var(--dim);font:500 13.5px var(--sans);cursor:pointer;white-space:nowrap}
#nav button:hover{color:var(--fg);background:var(--surface-2)}
#nav button.on{color:var(--fg);border-bottom-color:var(--acc)}
#nav button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}

main{padding:20px;max-width:var(--content);margin:0 auto}
h2{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px}
h2:first-child{margin-top:0}
.load{padding:24px;color:var(--dim);font:13px var(--mono)}

/* type */
.val,.num,td,.ro dd{font-variant-numeric:tabular-nums}

/* overview readout: the agent as a pipeline, not a tile grid */
.meta{font:13px/1.6 var(--sans);color:var(--dim);margin:0 0 20px;padding:10px 16px;
      width:fit-content;max-width:100%;background:var(--surface);border:1px solid var(--line);
      border-radius:var(--r);box-shadow:var(--shadow)}
.meta b{font:500 13px var(--mono);color:var(--fg)}
.meta b.warn{color:var(--warn)} .meta b.err{color:var(--err)}
.ro{display:flex;width:fit-content;max-width:100%;margin:0 0 20px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);overflow:hidden}
.ro .fig{position:relative;display:flex;flex-direction:column-reverse;padding:10px 16px}
.ro dt{font:12px/1.35 var(--sans);color:var(--dim);white-space:nowrap}
.ro dd{margin:0;font:500 20px/1.25 var(--mono);white-space:nowrap}
.ro dd.zero,.ro.off dd{color:var(--dim)}
.ro dd.warn{color:var(--warn)} .ro dd.err{color:var(--err)}
.ro .fig.flow+.fig.flow::before{content:"\2192";position:absolute;left:-9px;top:22px;
  transform:translateY(-50%);color:var(--dim);font:13px/1 var(--mono)}
.ro .fig.tally{border-left:1px solid var(--line)}
.ro .fig.tally+.fig.tally{border-left:0}

/* tables */
.tw{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
    box-shadow:var(--shadow);margin-bottom:20px}
table{width:100%;border-collapse:collapse;background:none;border:0;border-radius:0}
th{position:sticky;top:0;z-index:5;background:var(--surface-2);
   border-bottom:1px solid var(--line-strong);text-align:left;padding:7px 12px;white-space:nowrap;
   font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap;
   font:13px/1.45 var(--mono)}
tbody tr:last-child td,tr:last-child td{border-bottom:0}
tr:hover td{background:var(--surface-2)}
td:first-child{font-weight:500;color:var(--fg)}
td.num{text-align:center;font-variant-numeric:tabular-nums}
th.num{text-align:center}
td.wrap,td.logline,td.err{white-space:pre-wrap;word-break:break-word}
td.wrap{max-width:38ch}
td.err{min-width:20ch}
td.lvl{font:600 11px var(--sans);letter-spacing:.06em}
.ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)} .dim{color:var(--dim)}
table.kv th{position:static;width:1px;text-align:left;border-bottom:1px solid var(--line);background:none}
table.kv tr:last-child th{border-bottom:0}
tr.rowerr td{white-space:pre-wrap;word-break:break-word;color:var(--err);background:var(--err-bg);
  border-bottom:1px solid var(--line);font:12.5px/1.5 var(--mono)}

/* nav-adjacent dot */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;
     vertical-align:middle;box-shadow:0 0 0 2px var(--surface)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
#hstate .ok,#hstate .err,#hstate .warn{display:inline-flex;align-items:center;gap:6px;
  padding:3px 9px;border-radius:999px;font:600 12px var(--sans);border:1px solid currentColor}
#hstate .ok{background:var(--ok-bg)} #hstate .err{background:var(--err-bg)} #hstate .warn{background:var(--warn-bg)}

/* message banner */
#msg,.msg{display:none;margin-top:12px;padding:10px 12px;border-radius:var(--r-sm);
     border-left:3px solid;white-space:pre-wrap;font:13px/1.5 var(--mono)}
#msg.ok,.msg.ok{display:block;background:var(--ok-bg);border-color:var(--ok);color:var(--fg)}
#msg.warn,.msg.warn{display:block;background:var(--warn-bg);border-color:var(--warn);color:var(--fg)}
#msg.err,.msg.err{display:block;background:var(--err-bg);border-color:var(--err);color:var(--fg)}
.logline{font-size:12.5px;white-space:pre-wrap;word-break:break-word}

/* progress bar */
.bar{height:6px;background:var(--sunken);border:1px solid var(--line);border-radius:3px;
     overflow:hidden;margin-top:5px;min-width:90px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.bar.warn i{background:var(--warn)} .bar.err i{background:var(--err)}

/* buttons */
button{font:500 13px var(--sans);border-radius:var(--r-sm);padding:8px 14px;border:1px solid transparent;
       cursor:pointer;margin:0;background:var(--acc);color:var(--btn-ink)}
button:hover{filter:brightness(1.08)}
.btnbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.sec{background:var(--surface);border-color:var(--line);color:var(--fg)}
button.sec:hover{background:var(--surface-2);border-color:var(--line-strong)}
button.ghost{background:none;border-color:transparent;color:var(--dim)}
button.ghost:hover{color:var(--fg);background:var(--surface-2)}
button.danger{background:none;border-color:var(--err);color:var(--err)}
button.danger:hover{background:var(--err);color:var(--btn-ink)}
button:disabled,button:disabled:hover{background:var(--surface-2);border-color:var(--line);
  color:var(--fg-disabled);cursor:default;filter:none;opacity:1}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* config textarea + syntax-highlight overlay (highlight-behind-textarea technique) */
.cfgedit{position:relative}
#cfg,#cfghl{font:13px/1.55 var(--mono);padding:12px;tab-size:2;white-space:pre}
#cfg{display:block;width:100%;height:clamp(320px,calc(100vh - 320px),1200px);
  background:transparent;color:transparent;caret-color:var(--fg);
  border:1px solid var(--line);border-radius:var(--r);
  resize:vertical;overflow:auto;position:relative;z-index:2}
#cfg:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
#cfg:disabled{opacity:.6}
#cfghl{position:absolute;inset:0;z-index:1;margin:0;overflow:hidden;pointer-events:none;
  background:var(--sunken);color:var(--fg);border:1px solid transparent;border-radius:var(--r)}
#cfghl code{display:block;font:inherit;white-space:inherit;tab-size:inherit;color:inherit}
.tok-comment{color:var(--dim);font-style:italic}
.tok-key{color:var(--acc);font-weight:600}
.tok-string{color:var(--ok)}
.tok-number{color:var(--warn)}
.tok-bool{color:var(--err)}
.tok-list{color:var(--dim);font-weight:600}
.cfghead{display:flex;gap:10px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}
.cfghead .path{font:13px var(--mono);color:var(--dim);word-break:break-all}
.cfghead .dirty{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;
  color:var(--warn);padding:2px 7px;border:1px solid var(--warn);border-radius:999px}
.cfgbar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line)}

/* token gate */
body.locked header,body.locked nav,body.locked main{display:none}
#gate{display:grid;place-items:center;min-height:100vh;padding:20px}
.gcard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.gcard h1{font:600 15px/1.2 var(--sans);margin-bottom:6px}
.gcard .glogo{display:block;height:40px;width:auto;margin:0 auto 12px}
.gcard .gv{display:block;color:var(--dim);font-size:12px;margin:2px 0 10px}
.ghint{font:13px/1.55 var(--sans);color:var(--dim);margin-bottom:16px}
.ghint code{font:12.5px var(--mono);color:var(--fg)}
.gfield{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.gfield label{font:500 12px var(--sans);color:var(--dim)}
.gfield button{padding:2px 6px;font-size:12px}
#gtok{display:block;width:100%;background:var(--sunken);color:var(--fg);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;
  font:13px var(--mono);min-height:34px}
#gtok:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
#gtok:disabled{opacity:.6}
#gerr{margin-top:12px}
.gcard .btnbar{margin-top:14px}
@media (max-width:600px){#gate{padding:12px}.gcard{padding:16px}}

/* select / toolbar */
select{background:var(--surface);color:var(--fg);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:6px 10px;font:13px var(--sans);min-height:32px}
select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar label{font:500 12px var(--sans);color:var(--dim)}

/* breakpoints */
@media (max-width:900px){
  .ro{width:auto;flex-wrap:wrap;row-gap:2px}
  .ro .fig{flex:1 0 33%}
  .ro .fig+.fig{border-left:1px solid var(--line)}
  .ro .fig.flow+.fig.flow::before{content:none}
  nav{-webkit-overflow-scrolling:touch}
  .opt{display:none}
}
@media (max-width:600px){
  header{padding:8px 12px}
  .hmeta{flex-basis:100%;margin-left:0;justify-content:flex-start}
  main{padding:12px}
}
</style>
</head>

  </div>
</header>
<nav id="nav">
  <button type="button" data-p="overview" class="on">Overview</button>
  <button type="button" data-p="inputs">Inputs</button>
  <button type="button" data-p="outputs">Outputs</button>
  <button type="button" data-p="buffer">Buffer</button>
  <button type="button" data-p="config">Configuration</button>
  <button type="button" data-p="logs">Logs</button>
  <button type="button" data-p="about">About</button>
</nav>
<main id="main"></main>
<script>
"use strict";
let page="overview", timer=null, cfgDirty=false, paused=false, lastPage=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// The token is read once from the URL fragment (#token=...) or the in-page
// token gate, and kept in sessionStorage so a reload does not ask again. It
// is never placed in the query string, where it would land in access logs
// and Referer headers.
let locked=false;

function token(){return sessionStorage.getItem('snx_token')||''}

function readFragmentToken(){
  if(location.hash.startsWith('#token=')){
    const t=decodeURIComponent(location.hash.slice(7));
    if(t)sessionStorage.setItem('snx_token',t);
    history.replaceState(null,'',location.pathname);
  }
}

function gateError(t){const e=$("#gerr");e.textContent=t||"";e.hidden=!t}

function lock(err){
  locked=true;
  document.body.classList.add('locked');
  $("#gate").hidden=false;
  gateError(err||"");
  const i=$("#gtok");i.value="";i.disabled=false;i.focus();
  fetchGateVersion();
}

async function fetchGateVersion(){
  const v=$("#ggver");
  if(v.textContent)return;
  try{
    const r=await fetch("/healthz");
    const j=await r.json();
    if(j&&j.version)v.textContent="v"+j.version;
  }catch(e){}
}

function unlockUI(){
  locked=false;
  document.body.classList.remove('locked');
  $("#gate").hidden=true;
  $("#gtok").value="";gateError("");
}

function gateToggleShow(){
  const i=$("#gtok"),b=$("#gshow"),show=i.type==="password";
  i.type=show?"text":"password";
  b.textContent=show?"Hide":"Show";
  b.setAttribute("aria-pressed",String(show));
  i.focus();
}

async function gateSubmit(ev){
  ev.preventDefault();
  const i=$("#gtok"),b=$("#gbtn"),t=i.value.trim();
  if(!t){gateError("Enter the token.");i.focus();return}
  gateError("");b.disabled=true;i.disabled=true;b.textContent="Checking…";
  try{
    const r=await fetch("/api/status",{headers:{authorization:"Bearer "+t}});
    if(r.status===401){gateError("Token rejected. Check the web-token file in the data directory.");return}
    if(!r.ok){gateError("Agent returned HTTP "+r.status+". Check the agent log.");return}
    sessionStorage.setItem('snx_token',t);
    unlockUI();
    startApp();
  }catch(e){
    gateError("Cannot reach the agent. Check that it is still running.");
  }finally{
    b.disabled=false;b.textContent="Unlock";
    if(locked){i.disabled=false;i.focus()}
  }
}

function startApp(){
  if(cfgDirty&&page==="config")return;
  render();
  const n=$("#nav button.on");if(n)n.focus();
}

function authHeaders(extra){
  return Object.assign({'authorization':'Bearer '+token()},extra||{});
}

async function api(p,opt){
  opt=opt||{};
  const r=await fetch(p,Object.assign({},opt,{headers:authHeaders(opt.headers)}));
  if(r.status===401){
    sessionStorage.removeItem('snx_token');
    lock("Token rejected. Check the web-token file in the data directory.");
    const e=new Error("unauthorized");e.unauthorized=true;throw e;
  }
  const ct=r.headers.get("content-type")||"";
  const body=ct.includes("json")?await r.json():await r.text();
  return{ok:r.ok,status:r.status,body}
}
function fmtDur(s){if(s==null)return"-";const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+"d ":"")+(h?h+"h ":"")+m+"m "+Math.floor(s%60)+"s"}
function fmtBytes(b){if(b==null)return"-";const u=["B","KB","MB","GB"];let i=0;while(b>=1024&&i<3){b/=1024;i++}return b.toFixed(i?1:0)+" "+u[i]}
function fmtNum(n){return n==null?"—":n.toLocaleString('en-US')}
function fig(label,value,cls,flow){const c=cls||"";
  const mark=(c==="warn"||c==="err")?`<span class="dot ${c}"></span>`:"";
  return`<div class="fig ${flow?"flow":"tally"}"><dt>${esc(label)}</dt><dd class="${c}">${mark}${value}</dd></div>`}
function dot(ok){return`<span class="dot ${ok?"ok":"err"}"></span>`}

const pages={
async overview(){
  const {body:s}=await api("/api/status");
  $("#hver").textContent="v"+(s.version||"");
  $("#hstate").innerHTML=s.running?'<span class="ok">● running</span>':'<span class="err">● engine stopped</span>';
  const running=!!s.running;
  let dest=(s.destinations||[]).map(d=>`<tr><td>${dot(d.healthy)}${esc(d.id)}</td><td>${d.connected?'<span class="ok">connected</span>':'<span class="dim">idle</span>'}</td><td>${d.healthy?'<span class="ok">healthy</span>':'<span class="err">unhealthy</span>'}</td></tr>`).join("");
  const destList=s.destinations||[];
  const destHealthy=destList.filter(d=>d.healthy).length;
  const topMsg=!running
    ?'<div id="msg" class="warn" style="display:block" role="status" aria-live="polite">Engine is not running — inputs, outputs and queues are unavailable. Check the agent log.</div>'
    :"";
  const bottomMsg=(running && s.last_error)
    ?`<div id="msg" class="warn" style="display:block" role="status" aria-live="polite">Last error: ${esc(s.last_error)}</div>`
    :"";
  const z=n=>n?"":"zero";
  const destMeta=!destList.length
    ?'<span class="dot warn"></span><b class="warn">No destinations configured</b>'
    :destHealthy===destList.length
      ?`<b>${destHealthy} of ${destList.length}</b> destinations healthy`
      :`<span class="dot err"></span><b class="err">${destHealthy} of ${destList.length}</b> destinations healthy`;
  $("#main").innerHTML=`
  ${topMsg}
  <h2>Health</h2>
  <p class="meta">Up <b>${fmtDur(s.uptime_seconds)}</b> &middot; ${destMeta}</p>
  <h2>Throughput</h2>
  <dl class="ro${running?"":" off"}">
    ${fig("Received",fmtNum(s.events_received),z(s.events_received),1)}
    ${fig("Queued · "+fmtBytes(s.queue_bytes),running?fmtNum(s.queue_events):"—",z(s.queue_events),1)}
    ${fig("Sent",fmtNum(s.events_sent),z(s.events_sent),1)}
    ${fig("Failed",fmtNum(s.events_failed),s.events_failed?"warn":"zero")}
    ${fig("Dropped",fmtNum(s.events_dropped),s.events_dropped?"err":"zero")}
    ${fig("Errors",fmtNum(s.errors),s.errors?"warn":"zero")}
  </dl>
  ${bottomMsg}
  <h2>Destinations</h2>
  <div class="tw"><table><tr><th>Destination</th><th>Connection</th><th>Health</th></tr>${dest||'<tr><td colspan="3" class="dim">None configured.</td></tr>'}</table></div>`;
},
async inputs(){
  const {body:list}=await api("/api/inputs");
  const rows=(list||[]).map(i=>{
    const row=`<tr><td>${dot(i.active&&!i.last_error)}${esc(i.id)}</td><td>${esc(i.kind)}</td><td class="dim wrap" title="${esc(i.detail)}">${esc(i.detail)}</td><td class="num">${fmtNum(i.events)}</td><td>${i.active?'<span class="ok">active</span>':'<span class="dim">stopped</span>'}</td></tr>`;
    const err=i.last_error?`<tr class="rowerr"><td colspan="5">${dot(false)}<span class="err">${esc(i.last_error)}</span></td></tr>`:"";
    return row+err;
  }).join("");
  $("#main").innerHTML=`<div class="tw"><table><tr><th>Input</th><th>Type</th><th>Source</th><th class="num">Events</th><th>Status</th></tr>${rows||'<tr><td colspan="5" class="dim">No inputs configured. Add an inputs: section to the configuration.</td></tr>'}</table></div>`;
},
async outputs(){
  const {body:list}=await api("/api/outputs");
  const rows=(list||[]).map(o=>{
    const health=o.healthy?'<span class="ok">healthy</span>':`<span class="err">unhealthy${o.consecutive_failures?" ("+fmtNum(o.consecutive_failures)+"×)":""}</span>`;
    const row=`<tr><td>${dot(o.healthy)}${esc(o.id)}</td><td>${esc(o.kind)}</td><td class="dim wrap" title="${esc(o.detail)}">${esc(o.detail)}</td><td>${o.connected?'<span class="ok">connected</span>':'<span class="dim">idle</span>'}</td><td class="num">${fmtNum(o.events_sent)}</td><td class="num opt">${fmtNum(o.retries)}</td><td>${health}</td></tr>`;
    const err=o.last_error?`<tr class="rowerr"><td colspan="7">${dot(false)}<span class="err">${esc(o.last_error)}</span></td></tr>`:"";
    return row+err;
  }).join("");
  $("#main").innerHTML=`<div class="tw"><table><tr><th>Output</th><th>Type</th><th>Address</th><th>Connection</th><th class="num">Sent</th><th class="num opt">Retries</th><th>Health</th></tr>${rows||'<tr><td colspan="7" class="dim">No outputs configured. Events will be buffered until a destination exists.</td></tr>'}</table></div>`;
},
async buffer(){
  const {body:list}=await api("/api/buffer");
  const rows=(list||[]).map(b=>{
    const pct=b.usage_percent??0;
    const barCls=pct>=90?"err":pct>=70?"warn":"";
    return `<tr><td>${esc(b.destination)}</td><td class="num">${fmtNum(b.events)}</td><td>${fmtBytes(b.bytes)} / ${fmtBytes(b.max_bytes)} <span class="dim">${pct.toFixed(1)}%</span><div class="bar ${barCls}"><i style="width:${Math.min(100,pct)}%"></i></div></td><td>${b.oldest_event_age_seconds!=null?fmtDur(b.oldest_event_age_seconds):'<span class="dim">—</span>'}</td><td class="num ${b.dropped_events?"warn":""}">${fmtNum(b.dropped_events)}</td><td class="num ${b.corrupt_records?"warn":""}">${fmtNum(b.corrupt_records)}</td></tr>`;
  }).join("");
  $("#main").innerHTML=`<div class="tw"><table><tr><th>Destination</th><th class="num">Queued events</th><th>Disk usage</th><th>Oldest event</th><th class="num">Dropped</th><th class="num">Corrupt</th></tr>${rows||'<tr><td colspan="6" class="dim">No queues yet — a queue is created per destination.</td></tr>'}</table></div>`;
},
async config(){
  if(cfgDirty && $("#cfg")) return; // don't clobber edits on refresh
  const {ok,body}=await api("/api/config");
  const content=ok?body.content:"";
  $("#main").innerHTML=`
  <div class="cfghead"><span class="path">${ok?esc(body.path):""}</span><span class="dirty" id="cfgdirty" hidden>UNSAVED</span></div>
  <div class="cfgedit">
    <textarea id="cfg" wrap="off" spellcheck="false">${esc(content)}</textarea>
    <pre class="cfghl" id="cfghl" aria-hidden="true"><code id="cfghlcode"></code></pre>
  </div>
  <div class="cfgbar">
    <div class="btnbar">
      <button class="sec" onclick="cfgValidate()">Validate</button>
      <button class="sec" onclick="cfgSave()" ${!ok?"disabled":""}>Save</button>
      <button onclick="cfgReload()" ${!ok?"disabled":""}>Save &amp; Reload</button>
      <button class="ghost" onclick="setDirty(false);pages.config()">Discard changes</button>
      <button class="danger" onclick="cfgRollback()">Rollback to backup</button>
    </div>
    <div id="msg" role="status" aria-live="polite" class="${!ok?"err":""}" style="${!ok?"display:block":""}">${!ok?esc("Cannot read configuration: "+body):""}</div>
  </div>`;
  $("#cfg").addEventListener("input",()=>{setDirty(true);renderCfgHighlight()});
  $("#cfg").addEventListener("scroll",syncCfgHlScroll);
  renderCfgHighlight();
},
async logs(){
  const lvl=window._loglvl||"";
  const {body:list}=await api("/api/logs?limit=200"+(lvl?"&level="+lvl:""));
  const rows=(list||[]).map(l=>{const c=l.level==="ERROR"?"err":l.level==="WARN"?"warn":"dim";return`<tr><td class="dim">${esc(l.time)}</td><td class="lvl ${c}">${esc(l.level)}</td><td class="logline">${esc(l.message)}</td><td class="opt dim">${esc(l.target||"")}</td></tr>`}).join("");
  $("#main").innerHTML=`
  <div class="toolbar">
    <label for="lvl">Level</label>
    <select id="lvl" onchange="window._loglvl=this.value;pages.logs()">
      <option value="" ${!lvl?"selected":""}>all</option>
      <option value="warn" ${lvl==="warn"?"selected":""}>warnings+</option>
      <option value="error" ${lvl==="error"?"selected":""}>errors</option>
    </select>
    <span class="dim">(showing up to 200 recent entries)</span>
  </div>
  <div class="tw"><table><tr><th>Time</th><th>Level</th><th>Message</th><th class="opt">Target</th></tr>${rows||'<tr><td colspan="4" class="dim">No entries at this level.</td></tr>'}</table></div>`;
},
async about(){
  const {body:a}=await api("/api/about");
  $("#main").innerHTML=`<div class="tw"><table class="kv">
    <tr><th>Name</th><td>${esc(a.name)}</td></tr>
    <tr><th>Version</th><td>${esc(a.version)}</td></tr>
    <tr><th>Operating system</th><td>${esc(a.os)} (${esc(a.arch)})</td></tr>
    <tr><th>Hostname</th><td>${esc(a.hostname)}</td></tr>
    <tr><th>Config path</th><td class="wrap" title="${esc(a.config_path)}">${esc(a.config_path)}</td></tr>
    <tr><th>State path</th><td class="wrap" title="${esc(a.state_path||"-")}">${esc(a.state_path||"-")}</td></tr>
    <tr><th>PID</th><td>${a.pid}</td></tr>
  </table></div>`;
}};

function setDirty(v){cfgDirty=v;const d=$("#cfgdirty");if(d)d.hidden=!v}
function renderCfgHighlight(){
  const code=$("#cfghlcode"),cfg=$("#cfg");
  if(!code||!cfg)return;
  code.innerHTML=highlightYaml(cfg.value);
  syncCfgHlScroll();
}
function syncCfgHlScroll(){
  const hl=$("#cfghl"),cfg=$("#cfg");
  if(!hl||!cfg)return;
  hl.scrollTop=cfg.scrollTop;
  hl.scrollLeft=cfg.scrollLeft;
}
// Small line-oriented YAML tokenizer for the config editor's highlight overlay.
// Not a real parser: just enough to color comments, keys, quoted strings,
// numbers, true/false/null/~, and "-" list markers. Everything else keeps
// the default text color. Raw text is always escaped before it can reach
// innerHTML.
function highlightYaml(text){
  return String(text??"").split("\n").map(highlightYamlLine).join("\n");
}
function highlightYamlLine(line){
  let code=line,comment="";
  let inS=false,inD=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==="'"&&!inD)inS=!inS;
    else if(c==='"'&&!inS)inD=!inD;
    else if(c==="#"&&!inS&&!inD&&(i===0||/\s/.test(line[i-1]))){
      code=line.slice(0,i);
      comment=line.slice(i);
      break;
    }
  }
  let out=highlightYamlCode(code);
  if(comment)out+=`<span class="tok-comment">${esc(comment)}</span>`;
  return out;
}
function highlightYamlCode(code){
  const indent=code.match(/^\s*/)[0];
  let rest=code.slice(indent.length);
  let out=esc(indent);
  const listMatch=rest.match(/^-(\s+|$)/);
  if(listMatch){
    out+='<span class="tok-list">-</span>'+esc(listMatch[1]);
    rest=rest.slice(listMatch[0].length);
  }
  const keyMatch=rest.match(/^("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|[^:#\s][^:#]*?)(:)(\s|$)/);
  if(keyMatch){
    out+='<span class="tok-key">'+esc(keyMatch[1])+'</span><span class="tok-key">:</span>'+esc(keyMatch[3]);
    rest=rest.slice(keyMatch[0].length);
  }
  out+=highlightYamlValue(rest);
  return out;
}
function highlightYamlValue(text){
  // Classify the value as a whole (trimmed), not by scanning for digit
  // runs inside it — a path or UUID like "claude-501/-...-0370-..." has
  // digits but is not a number, and must not get partially highlighted.
  const m=text.match(/^(\s*)([\s\S]*?)(\s*)$/);
  const lead=m[1],val=m[2],trail=m[3];
  if(!val)return esc(text);
  if(/^'(?:[^'\\]|\\.)*'$/.test(val)||/^"(?:[^"\\]|\\.)*"$/.test(val))
    return esc(lead)+`<span class="tok-string">${esc(val)}</span>`+esc(trail);
  if(/^[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/.test(val))
    return esc(lead)+`<span class="tok-number">${esc(val)}</span>`+esc(trail);
  if(/^(?:[Tt]rue|TRUE|[Ff]alse|FALSE|[Nn]ull|NULL|~)$/.test(val))
    return esc(lead)+`<span class="tok-bool">${esc(val)}</span>`+esc(trail);
  return esc(text);
}
function setBtnsDisabled(v){document.querySelectorAll(".btnbar button").forEach(b=>b.disabled=v)}
function showMsg(cls,text){
  let m=$("#msg");
  if(!m){
    m=document.createElement("div");
    m.id="msg";
    m.setAttribute("role","status");
    m.setAttribute("aria-live","polite");
    ($("#main")||document.body).prepend(m);
  }
  m.className=cls;m.textContent=text;
}
async function cfgValidate(){
  const {body}=await api("/api/config/validate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({content:$("#cfg").value})});
  if(body.valid)showMsg(body.warnings&&body.warnings.length?"warn":"ok","Valid."+(body.warnings||[]).map(w=>"\nWarning: "+w).join(""));
  else showMsg("err","Invalid:\n"+body.error);
}
async function cfgSave(){
  const {ok,body}=await api("/api/config/save",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({content:$("#cfg").value})});
  if(ok&&body.saved){setDirty(false);showMsg("ok","Saved. Previous config backed up to "+body.backup+(body.warnings||[]).map(w=>"\nWarning: "+w).join(""))}
  else showMsg("err","Not saved:\n"+(body.error||body));
}
async function cfgReload(){
  setBtnsDisabled(true);
  try{
    if(cfgDirty){const {ok,body}=await api("/api/config/save",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({content:$("#cfg").value})});
      if(!(ok&&body.saved)){showMsg("err","Not saved:\n"+(body.error||body));return}
      setDirty(false);}
    showMsg("warn","Reloading...");
    const {ok,body}=await api("/api/config/reload",{method:"POST"});
    if(ok&&body.reloaded)showMsg("ok","Configuration reloaded successfully.");
    else showMsg("err","Reload failed (previous config restored):\n"+(body.error||body));
  } finally {
    setBtnsDisabled(false);
  }
}
async function cfgRollback(){
  if(!confirm("Restore the previous configuration backup and reload?"))return;
  setBtnsDisabled(true);
  try{
    const {ok,body}=await api("/api/config/rollback",{method:"POST"});
    if(ok&&body.rolled_back){setDirty(false);showMsg("ok","Rolled back and reloaded.");pages.config()}
    else showMsg("err","Rollback failed:\n"+(body.error||body));
  } finally {
    setBtnsDisabled(false);
  }
}
function togglePause(){
  paused=!paused;
  const l=$("#hlive");
  if(l){l.textContent=paused?"⏸ paused":"⟳ live 3s";l.classList.toggle("paused",paused)}
  const b=$("#hpausebtn");
  if(b)b.textContent=paused?"Resume":"Pause";
}

document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));
  page=b.dataset.p;cfgDirty=false;render();
});
async function render(){
  if(page!==lastPage){$("#main").innerHTML='<div class="load">Loading…</div>';lastPage=page}
  try{await pages[page]()}
  catch(e){
    if(e&&e.unauthorized)return;
    $("#main").innerHTML='<div id="msg" class="err" style="display:block" role="status" aria-live="polite">Could not load this page: '+esc(e)+"</div>";lastPage=null;
  }
}
function tick(){if(document.hidden||paused||locked||page==="config")return;render()}
window.addEventListener('unhandledrejection',e=>{if(e.reason&&e.reason.unauthorized)e.preventDefault()});
readFragmentToken();
if(token())startApp(); else lock("");
timer=setInterval(tick,3000);
</script>
</body>
</html>
