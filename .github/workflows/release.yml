name: Release

# Builds and publishes a GitHub Release when a `vX.Y.Z` tag is pushed.
# Two artifacts: a Linux tarball (built on ubuntu-latest) and a Windows MSI
# (built natively on windows-latest with WiX v3 — the same test-windows
# already proves cargo build --release works on this exact runner image,
# so this reuses a path this CI already trusts, rather than the
# msitools/wixl cross-compile from Linux that packaging/windows/build-msi.sh
# documents for a human's own machine: Ubuntu 24.04's apt-packaged msitools
# 0.103+repack-1build3 installs cleanly but does not actually ship a `wixl`
# binary — confirmed by running this pipeline for real — so CI does not use
# that script at all).
#
# Actions are pinned to a commit SHA, not a floating version tag — a tag can
# be repointed by the action's maintainer (or a compromised account); a SHA
# cannot. The trailing comment names the version resolved at pin time only
# for humans re-verifying the pin, not something Actions itself reads.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag must match Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION} — bump Cargo.toml first"
            exit 1
          fi

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, resolved 2026-09-07
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      # Static musl build, not the runner's glibc: a binary built against
      # ubuntu-latest's glibc 2.39 requires GLIBC_2.39 at runtime and fails
      # with "does not run on this host" on RHEL/Rocky 8 (2.28), RHEL 9
      # (2.34), Debian 11 (2.31) - confirmed on a real customer install of
      # v0.1.1. musl links libc in, so one binary runs on any x86_64 Linux.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Confirm the binary is static
        run: |
          file target/x86_64-unknown-linux-musl/release/softnix-log-agent
          if ldd target/x86_64-unknown-linux-musl/release/softnix-log-agent 2>&1 | grep -q 'not a dynamic executable\|statically linked'; then
            echo "static: ok"
          else
            echo "::error::release binary is dynamically linked - it will not run on hosts with an older glibc"
            exit 1
          fi
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="softnix-log-agent-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE"
          cp target/x86_64-unknown-linux-musl/release/softnix-log-agent "$STAGE/"
          cp packaging/install-linux.sh "$STAGE/"
          cp packaging/softnix-log-agent.service "$STAGE/"
          cp examples/agent.yaml "$STAGE/"
          tar czf "${STAGE}.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release
          path: softnix-log-agent-*-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows-msi:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, resolved 2026-09-07
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - run: cargo build --release
      # windows-latest ships Chocolatey preinstalled; this is the standard,
      # widely-used way to get WiX v3's candle/light onto a GH-hosted
      # Windows runner (no apt/wixl involved at all).
      - name: Install WiX Toolset v3
        run: choco install wixtoolset -y --no-progress
      - name: Build MSI
        shell: pwsh
        run: |
          $wixBin = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin" -Directory -ErrorAction Stop | Select-Object -First 1).FullName
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value

          $stage = "$env:RUNNER_TEMP\msi-stage"
          New-Item -ItemType Directory -Force -Path "$stage\packaging\windows" | Out-Null
          Copy-Item target\release\softnix-log-agent.exe "$stage\softnix-log-agent.exe"
          Copy-Item packaging\windows\agent-default.yaml "$stage\packaging\windows\agent-default.yaml"

          New-Item -ItemType Directory -Force -Path dist, obj | Out-Null
          # -arch x64: both components are Win64="yes" but the .wxs itself
          # never declares a platform, so light's ICE80 check fails without
          # this ("package contains 64 bit component ... but the Template
          # Summary Property does not contain Intel64 or x64") - wixl doesn't
          # enforce this ICE, which is why it wasn't caught building locally.
          & "$wixBin\candle.exe" -nologo -arch x64 "-dSourceDir=$stage" "-dVersion=$version" packaging\windows\softnix-log-agent.wxs -o obj\
          if ($LASTEXITCODE -ne 0) { throw "candle failed with exit code $LASTEXITCODE" }
          & "$wixBin\light.exe" -nologo obj\softnix-log-agent.wixobj -o "dist\softnix-log-agent-$version-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "light failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msi
          path: dist/*.msi
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows-msi]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes needs the actual repo (it walks
      # git history since the last tag to build the notes) - confirmed by
      # running this pipeline for real: without this, it fails with
      # "fatal: not a git repository".
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Build the update manifest (hashes the inner payloads, not the outer bundles)
        run: |
          cd artifacts
          VERSION="${GITHUB_REF_NAME#v}"
          LINUX_TARBALL=$(basename linux-release/*.tar.gz)
          MSI_FILE=$(basename windows-msi/*.msi)

          # Extract just the binary to hash the inner payload, per the
          # design note above — do not hash the tarball itself.
          mkdir -p _linux_extract
          tar xzf "linux-release/$LINUX_TARBALL" -C _linux_extract
          LINUX_BINARY=$(find _linux_extract -type f -name softnix-log-agent)
          LINUX_SHA=$(sha256sum "$LINUX_BINARY" | cut -d' ' -f1)
          LINUX_SIZE=$(stat -c%s "$LINUX_BINARY")

          MSI_SHA=$(sha256sum "windows-msi/$MSI_FILE" | cut -d' ' -f1)
          MSI_SIZE=$(stat -c%s "windows-msi/$MSI_FILE")

          # Both bundle filenames are chosen here, before either bundle is
          # actually built (next step) — deterministic names so this
          # manifest's `url` fields match what gets uploaded later in this
          # same job.
          LINUX_BUNDLE="softnix-log-agent-$VERSION-linux-x86_64.tar.gz"
          WINDOWS_BUNDLE="softnix-log-agent-$VERSION-windows-x86_64-update.zip"

          cat > manifest.json <<JSON
          {
            "schema_version": 1,
            "product": "softnix-log-agent",
            "version": "$VERSION",
            "manifest_serial": ${{ github.run_number }},
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "expires_at": "$(date -u -d '+2 years' +%Y-%m-%dT%H:%M:%SZ)",
            "artifacts": [
              {"platform": "linux", "arch": "x86_64", "filename": "$LINUX_BUNDLE", "url": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$LINUX_BUNDLE", "sha256": "$LINUX_SHA", "size": $LINUX_SIZE},
              {"platform": "windows", "arch": "x86_64", "filename": "$WINDOWS_BUNDLE", "url": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$WINDOWS_BUNDLE", "sha256": "$MSI_SHA", "size": $MSI_SIZE}
            ]
          }
          JSON
          cat manifest.json
      - name: Sign the manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd artifacts
          echo "$RELEASE_SIGNING_KEY" > /tmp/release-signing-key.pem
          openssl pkeyutl -sign -inkey /tmp/release-signing-key.pem -rawin -in manifest.json -out manifest.json.sig
          shred -u /tmp/release-signing-key.pem
      - name: Bundle the manifest into each platform's self-update artifact
        run: |
          cd artifacts
          VERSION="${GITHUB_REF_NAME#v}"
          LINUX_TARBALL=$(basename linux-release/*.tar.gz)
          MSI_FILE=$(basename windows-msi/*.msi)

          # Linux: add manifest.json/.sig into the already-extracted
          # staging dir from the previous step, re-tar over the same
          # filename — this one file keeps serving both a normal manual
          # install and `upgrade --from`.
          STAGE_DIR=$(find _linux_extract -maxdepth 1 -mindepth 1 -type d)
          cp manifest.json manifest.json.sig "$STAGE_DIR/"
          rm -f "linux-release/$LINUX_TARBALL"
          tar czf "linux-release/$LINUX_TARBALL" -C _linux_extract "$(basename "$STAGE_DIR")"

          # Windows: no existing single-file container to add to, so build
          # a new one specifically for updates. The bare .msi in
          # windows-msi/ is left untouched and still published separately
          # for ordinary manual installs.
          WINDOWS_BUNDLE="softnix-log-agent-$VERSION-windows-x86_64-update.zip"
          mkdir -p _win_bundle
          cp "windows-msi/$MSI_FILE" manifest.json manifest.json.sig _win_bundle/
          (cd _win_bundle && zip -j "../windows-msi/$WINDOWS_BUNDLE" "$MSI_FILE" manifest.json manifest.json.sig)
      - name: Checksum the artifacts
        run: |
          cd artifacts
          sha256sum linux-release/*.tar.gz windows-msi/*.msi windows-msi/*-update.zip \
            | sed 's#linux-release/##; s#windows-msi/##' > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/linux-release/*.tar.gz \
            artifacts/windows-msi/*.msi \
            artifacts/windows-msi/*-update.zip \
            artifacts/SHA256SUMS \
            artifacts/manifest.json \
            artifacts/manifest.json.sig \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
