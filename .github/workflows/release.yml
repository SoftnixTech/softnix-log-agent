name: Release

# Builds and publishes a GitHub Release when a `vX.Y.Z` tag is pushed.
# Two artifacts: a Linux tarball (built on ubuntu-latest) and a Windows MSI
# (built natively on windows-latest with WiX v3 — the same test-windows
# already proves cargo build --release works on this exact runner image,
# so this reuses a path this CI already trusts, rather than the
# msitools/wixl cross-compile from Linux that packaging/windows/build-msi.sh
# documents for a human's own machine: Ubuntu 24.04's apt-packaged msitools
# 0.103+repack-1build3 installs cleanly but does not actually ship a `wixl`
# binary — confirmed by running this pipeline for real — so CI does not use
# that script at all).
#
# Actions are pinned to a commit SHA, not a floating version tag — a tag can
# be repointed by the action's maintainer (or a compromised account); a SHA
# cannot. The trailing comment names the version resolved at pin time only
# for humans re-verifying the pin, not something Actions itself reads.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag must match Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION} — bump Cargo.toml first"
            exit 1
          fi

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, resolved 2026-09-07
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - run: cargo build --release
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="softnix-log-agent-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE"
          cp target/release/softnix-log-agent "$STAGE/"
          cp packaging/install-linux.sh "$STAGE/"
          cp packaging/softnix-log-agent.service "$STAGE/"
          cp examples/agent.yaml "$STAGE/"
          tar czf "${STAGE}.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release
          path: softnix-log-agent-*-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows-msi:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, resolved 2026-09-07
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - run: cargo build --release
      # windows-latest ships Chocolatey preinstalled; this is the standard,
      # widely-used way to get WiX v3's candle/light onto a GH-hosted
      # Windows runner (no apt/wixl involved at all).
      - name: Install WiX Toolset v3
        run: choco install wixtoolset -y --no-progress
      - name: Build MSI
        shell: pwsh
        run: |
          $wixBin = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin" -Directory -ErrorAction Stop | Select-Object -First 1).FullName
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value

          $stage = "$env:RUNNER_TEMP\msi-stage"
          New-Item -ItemType Directory -Force -Path "$stage\packaging\windows" | Out-Null
          Copy-Item target\release\softnix-log-agent.exe "$stage\softnix-log-agent.exe"
          Copy-Item packaging\windows\agent-default.yaml "$stage\packaging\windows\agent-default.yaml"

          New-Item -ItemType Directory -Force -Path dist, obj | Out-Null
          # -arch x64: both components are Win64="yes" but the .wxs itself
          # never declares a platform, so light's ICE80 check fails without
          # this ("package contains 64 bit component ... but the Template
          # Summary Property does not contain Intel64 or x64") - wixl doesn't
          # enforce this ICE, which is why it wasn't caught building locally.
          & "$wixBin\candle.exe" -nologo -arch x64 "-dSourceDir=$stage" packaging\windows\softnix-log-agent.wxs -o obj\
          if ($LASTEXITCODE -ne 0) { throw "candle failed with exit code $LASTEXITCODE" }
          & "$wixBin\light.exe" -nologo obj\softnix-log-agent.wixobj -o "dist\softnix-log-agent-$version-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "light failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msi
          path: dist/*.msi
          if-no-files-found: error

  publish:
    needs: [build-linux, build-windows-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --generate-notes needs the actual repo (it walks
      # git history since the last tag to build the notes) - confirmed by
      # running this pipeline for real: without this, it fails with
      # "fatal: not a git repository".
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Checksum the artifacts
        run: |
          cd artifacts
          sha256sum linux-release/*.tar.gz windows-msi/*.msi \
            | sed 's#linux-release/##; s#windows-msi/##' > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/linux-release/*.tar.gz \
            artifacts/windows-msi/*.msi \
            artifacts/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
